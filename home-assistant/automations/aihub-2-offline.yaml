# 2. AIHub stopped reporting (down, hung, or off the network)
alias: AIHub - offline
triggers:
  - trigger: state
    entity_id: binary_sensor.aihub_online
    to: unavailable
    for: "00:05:00"
actions:
  - action: notify.mobile_app_your_phone
    data:
      title: "AIHub offline"
      message: "No data from the server for 8 minutes. It may be down or off the network."
      data:
        tag: aihub-offline
        priority: high
