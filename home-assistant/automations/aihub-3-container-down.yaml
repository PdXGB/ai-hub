# 3. A container stopped or went unhealthy for 5 minutes
alias: AIHub - container down
triggers:
  - trigger: state
    entity_id: binary_sensor.aihub_all_containers
    to: "off"
    for: "00:05:00"
actions:
  - action: notify.mobile_app_your_phone
    data:
      title: "AIHub container problem"
      message: >-
        {% set ns = namespace(bad=[]) %}
        {% for s in states.sensor | selectattr('entity_id', 'search', '^sensor\.aihub_container_')
             | rejectattr('entity_id', 'search', 'updates') %}
          {% if s.state != 'running' %}{% set ns.bad = ns.bad + [s.name ~ ': ' ~ s.state] %}{% endif %}
        {% endfor %}
        {{ ns.bad | join(', ') if ns.bad else 'One or more containers are not running.' }}
      data:
        tag: aihub-containers
