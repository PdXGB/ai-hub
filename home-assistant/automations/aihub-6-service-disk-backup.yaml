# 6. ComfyUI / LiteLLM / disks / backups / restore drill problem for 10 minutes
alias: AIHub - service, disk or backup problem
triggers:
  - trigger: state
    entity_id:
      - binary_sensor.aihub_comfyui
      - binary_sensor.aihub_litellm
      - binary_sensor.aihub_disks
      - binary_sensor.aihub_backups
      - binary_sensor.aihub_restore_test
    to: "off"
    for: "00:10:00"
actions:
  - action: notify.mobile_app_your_phone
    data:
      title: "AIHub: {{ trigger.to_state.name }} problem"
      message: >-
        {% set e = trigger.entity_id %}
        {% if e.endswith('backups') %}{{ (state_attr(e, 'items') or ['backup check failed']) | join(', ') }}
        {% elif e.endswith('restore_test') %}{{ (state_attr(e, 'items') or ['restore drill failed']) | join(', ') }}
        {% elif e.endswith('disks') %}{% for m, p in (state_attr(e, 'items') or {}).items() if p is none or p >= 85 %}{{ m }} {{ p ~ '%' if p is not none else 'unreadable' }}{{ ', ' if not loop.last }}{% endfor %}
        {% else %}{{ trigger.to_state.name }} is down on the server.{% endif %}
      data:
        tag: "aihub-{{ trigger.entity_id.split('_')[-1] }}"
        priority: high
mode: queued
