# 4. GPU / NVIDIA driver not responding (driver/library mismatch, GPU fell off the bus)
alias: AIHub - GPU problem
triggers:
  - trigger: state
    entity_id: binary_sensor.aihub_gpu
    to: "off"
    for: "00:03:00"
actions:
  - action: notify.mobile_app_your_phone
    data:
      title: "AIHub GPU problem"
      message: "nvidia-smi is failing on the server. Local models are down. Check with: nvidia-smi"
      data:
        tag: aihub-gpu
        priority: high
