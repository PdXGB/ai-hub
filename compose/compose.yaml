x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["${GPU_MAIN_UUID}"]
            capabilities: [gpu]

x-gpu-ha: &gpu_ha
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["${GPU_HA_UUID}"]   # RTX 2060 12GB (HA card)
            capabilities: [gpu]

services:
  ollama:
    image: ollama/ollama:0.40.11
    restart: unless-stopped
    <<: *gpu
    ports: ["127.0.0.1:11434:11434"]
    volumes: ["/srv/models/ollama:/root/.ollama"]
    environment:
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_MAX_LOADED_MODELS: 2
      OLLAMA_FLASH_ATTENTION: 1
      OLLAMA_KV_CACHE_TYPE: q8_0

  litellm-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD}
      POSTGRES_DB: litellm
    volumes: ["/srv/data/litellm-db:/var/lib/postgresql/data"]

  litellm:
    image: ghcr.io/berriai/litellm:main-stable@sha256:74d0696a9f0afcc993c7659d246f0c542f003368298633e852228250779f1032
    restart: unless-stopped
    depends_on: [litellm-db, ollama]
    ports: ["127.0.0.1:4000:4000", "${GROOT_LAN_IP}:4000:4000"]
    volumes: ["./litellm/config.yaml:/app/config.yaml:ro"]
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@litellm-db:5432/litellm
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      XAI_API_KEY: ${XAI_API_KEY}

  open-webui:
    image: ghcr.io/open-webui/open-webui:main@sha256:4860ba005ae8f19f08d1e12b0868855b7b339ea0dad9927f196820fc0de04575
    restart: unless-stopped
    depends_on: [litellm]
    ports: ["3000:8080"]
    volumes: ["/srv/data/open-webui:/app/backend/data"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      ENABLE_OLLAMA_API: "false"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}

  n8n-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
      POSTGRES_DB: n8n
    volumes: ["/srv/data/n8n-db:/var/lib/postgresql/data"]

  n8n:
    image: n8nio/n8n:stable@sha256:d02752c6ab446ae9db8deec2f9cc887c378f77cdcad31650814df936b7386dfb
    restart: unless-stopped
    depends_on: [n8n-db]
    ports: ["5678:5678"]
    volumes: ["/srv/data/n8n:/home/node/.n8n"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_HOST: ${N8N_HOSTNAME}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_HOSTNAME}/
      N8N_PROXY_HOPS: 1
      N8N_RUNNERS_TASK_TIMEOUT: 1200
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}

  cloudflared:
    image: cloudflare/cloudflared:latest@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [open-webui, n8n]

  ollama-ha:
    image: ollama/ollama:0.40.11
    restart: unless-stopped
    <<: *gpu_ha
    ports: ["127.0.0.1:11435:11434"]
    volumes: ["/srv/models/ollama-ha:/root/.ollama"]
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_CONTEXT_LENGTH: 16384
      OLLAMA_FLASH_ATTENTION: 1
      OLLAMA_KV_CACHE_TYPE: q8_0

  whisper:
    image: lscr.io/linuxserver/faster-whisper:gpu@sha256:0f954616743a01cd5a7c7dc32d749873f5c03cfca38aab30c8160607cb4eb4a0
    restart: unless-stopped
    <<: *gpu_ha
    ports: ["${GROOT_LAN_IP}:10300:10300"]
    volumes: ["/srv/data/whisper:/config"]
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ}
      WHISPER_MODEL: distil-large-v3
      WHISPER_LANG: en
      WHISPER_BEAM: 1

  piper:
    image: lscr.io/linuxserver/piper:latest@sha256:b03c5e49b4ed899de5e4b7647d5a2395e6972bed0fe97215bc3ea3cbc0af94df
    restart: unless-stopped
    ports: ["${GROOT_LAN_IP}:10200:10200"]
    volumes: ["/srv/data/piper:/config"]
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ}
      PIPER_VOICE: en_US-lessac-medium

  searxng:
    image: searxng/searxng:latest@sha256:23482d8ecf7ddf66029479468ea04c1bb11d2b65785a17a7e629e2ffd13296ca
    restart: unless-stopped
    ports: ["127.0.0.1:8888:8080"]
    volumes: ["./searxng:/etc/searxng"]
