# /etc/samba/smb.conf — Samba only for the AI library (docs/12-library.md).
# LAN only, SMB3 only, encryption required, no guest, no NetBIOS (nmbd disabled), no printers.
# Placeholders: <LAN_IFACE> (e.g. enp3s0), <LAN_CIDR> (your LAN in CIDR form), <user> (the library owner).
[global]
   server string = aihub library
   workgroup = WORKGROUP
   server role = standalone server
   interfaces = lo <LAN_IFACE>
   bind interfaces only = yes
   hosts allow = 127.0.0.1 <LAN_CIDR>
   hosts deny = 0.0.0.0/0
   smb ports = 445
   disable netbios = yes
   server min protocol = SMB3_00
   server smb encrypt = required
   map to guest = never
   restrict anonymous = 2
   usershare max shares = 0
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   obey pam restrictions = yes
   unix password sync = no

# Everything: _shared/, work/, personal/
[library]
   path = /srv/library
   valid users = <user>
   read only = no
   create mask = 0600
   directory mask = 0700

# Work only, for a work PC
[library-work]
   path = /srv/library/work
   valid users = <user>
   read only = no
   create mask = 0600
   directory mask = 0700
